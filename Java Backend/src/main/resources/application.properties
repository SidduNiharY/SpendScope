# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# PostgreSQL Datasource
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/upi_insights
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# Flyway (DB migrations)
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================
# Upload Settings (we'll use this soon)
# ===============================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Local storage for uploaded files (we'll use this in UploadService)
app.storage.upload-dir=./storage/uploads


# JWT
app.jwt.secret=JFSAIOHFAPSHFK;LSJ;jKJDLSKJFASJFL;SFJds#$%^&^%$jasl;hfpwegrsjfas
app.jwt.exp-minutes=10080



# ===============================
# LOGGING (MINIMAL + USEFUL)
# ===============================

# Don't use debug=true unless you want Spring's condition report noise
debug=false

# App logs
logging.level.root=INFO
logging.level.com.siddu.upiinsights=DEBUG

# Web requests (shows request mapping + basic request flow)
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

# Shows request path + params (VERY helpful for frontend calls)
spring.mvc.log-request-details=true

# Security (keep DEBUG, TRACE is too noisy)
logging.level.org.springframework.security=DEBUG

# CORS (use INFO or DEBUG only when debugging CORS)
logging.level.org.springframework.web.cors=INFO

# SQL (show queries but not full parameter spam)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# (Optional) Enable this ONLY when you need SQL params
#logging.level.org.hibernate.orm.jdbc.bind=TRACE



server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=true



